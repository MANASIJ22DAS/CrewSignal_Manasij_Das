<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CrewSignal</title>
  <meta name="theme-color" content="#1fb6ff">
  <link rel="manifest" href="/static/manifest.json">
  <link rel="stylesheet" href="/static/styles.css">
  <script src="https://cdn.plot.ly/plotly-2.24.1.min.js"></script>
</head>
<body>
  <div class="app-shell">
    <header class="topbar">
      <div>
        <div class="eyebrow">HealthTech • Mission Support</div>
        <h1>CrewSignal</h1>
      </div>
      <div id="connectivityStatus" class="status-pill" aria-live="polite">Checking connectivity...</div>
    </header>

    <main class="grid">
      <section class="panel form-panel" aria-labelledby="monitoring-form-title">
        <h2 id="monitoring-form-title" class="panel-title">Mission Monitoring</h2>
        <form id="healthForm" aria-label="Astronaut health form">
          <div class="field-row">
            <div class="field-wrap">
              <label class="sr-only" for="astronaut_id">Astronaut ID</label>
              <input id="astronaut_id" placeholder="Astronaut ID" required>
            </div>
            <div class="field-wrap">
              <label class="sr-only" for="astronaut_name">Astronaut Name</label>
              <input id="astronaut_name" placeholder="Astronaut Name" required>
            </div>
          </div>
          <div class="field-row">
            <div class="field-wrap">
              <label class="sr-only" for="age">Age</label>
              <input id="age" type="number" placeholder="Age" required>
            </div>
            <div class="field-wrap">
              <label class="sr-only" for="sex">Sex</label>
              <select id="sex" required>
                <option value="">Sex</option>
                <option value="M">Male</option>
                <option value="F">Female</option>
                <option value="O">Other</option>
              </select>
            </div>
          </div>
          <div class="field-row single">
            <div class="field-wrap">
              <label class="sr-only" for="time">Timestamp</label>
              <input id="time" type="text" placeholder="Timestamp" required>
            </div>
          </div>
          <div class="field-row triple">
            <div class="field-wrap">
              <label class="sr-only" for="pulse">Pulse</label>
              <input id="pulse" type="number" step="0.1" placeholder="Pulse" required>
            </div>
            <div class="field-wrap">
              <label class="sr-only" for="body_temperature">Body Temperature</label>
              <input id="body_temperature" type="number" step="0.1" placeholder="Body Temperature" required>
            </div>
            <div class="field-wrap">
              <label class="sr-only" for="SpO2">SpO2 Level</label>
              <input id="SpO2" type="number" step="0.1" placeholder="SpO2 Level" required>
            </div>
          </div>
          <div class="kpi-row">
            <div class="mini-card">
              <span>Session Start</span>
              <strong id="sessionStart">--</strong>
            </div>
            <div class="mini-card">
              <span>Elapsed Time</span>
              <strong id="elapsedTime">00:00:00</strong>
            </div>
          </div>
          <div class="button-row">
            <button type="button" id="saveLocalBtn" class="primary">Save Local</button>
            <button type="button" id="predictBtn" class="secondary">Predict</button>
            <button type="button" id="trainBtn" class="accent">Train Models</button>
          </div>
        </form>

        <div id="percentChanges" class="info-box" aria-live="polite">No readings yet</div>
        <div id="ruleOutput" class="info-box accent" aria-live="polite">Rule-based output pending</div>
        <div id="modelOutput" class="info-box dark" aria-live="polite">ML output pending</div>
      </section>

      <section class="panel chart-panel" aria-label="Vital trend charts">
        <div id="heartRateChart" class="chart-box"></div>
        <div id="tempChart" class="chart-box"></div>
        <div id="spo2Chart" class="chart-box"></div>
      </section>

      <section class="panel metrics-panel" aria-label="Model performance panel">
        <h2>Model Performance</h2>
        <div id="metricsArea"></div>
        <div id="performanceChart" class="chart-box"></div>
        <div id="rfCmChart" class="chart-box"></div>
        <div id="svmCmChart" class="chart-box"></div>
      </section>
    </main>
  </div>

  <audio id="alertAudio" preload="auto" src="/emergency_voice.mp3"></audio>
  <script src="/static/app.js"></script>
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => navigator.serviceWorker.register('/static/service-worker.js'))
    }
  </script>
</body>
</html>
