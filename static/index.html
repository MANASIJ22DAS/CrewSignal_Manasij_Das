<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>CrewSignal - Predict</title>
  <style>body{font-family:Arial,Helvetica,sans-serif;max-width:700px;margin:30px}label{display:block;margin-top:10px}input,select{width:100%;padding:8px;margin-top:4px}button{margin-top:12px;padding:10px 16px}</style>
</head>
<body>
  <h1>CrewSignal — Predict Health Status</h1>
  <form id="predict-form">
    <label>Astronaut ID<input name="astronaut_id" required></label>
    <label>Astronaut Name<input name="astronaut_name" required></label>
    <label>Age<input name="age" type="number" required></label>
    <label>Sex<select name="sex"><option value="M">M</option><option value="F">F</option></select></label>
    <label>Time (ISO)<input name="time" placeholder="2023-01-01T12:00:00" required></label>
    <label>Pulse<input name="pulse" type="number" required></label>
    <label>Body Temperature<input name="body_temperature" type="number" step="0.1" required></label>
    <label>SpO2<input name="SpO2" type="number" required></label>
    <button type="submit">Predict</button>
  </form>

  <h2>Result</h2>
  <pre id="result">No result yet</pre>

  <script>
    const form=document.getElementById('predict-form');
    const out=document.getElementById('result');
    form.addEventListener('submit', async (e)=>{
      e.preventDefault();
      const data = Object.fromEntries(new FormData(form).entries());
      out.textContent = 'Calling /api/predict...';
      try{
        const resp = await fetch('/api/predict',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(data)});
        const json = await resp.json();
        if(!resp.ok){ out.textContent = 'Error: '+JSON.stringify(json,null,2); return }
        out.textContent = JSON.stringify(json,null,2);
      }catch(err){ out.textContent = 'Request failed: '+err.message }
    });
  </script>
</body>
</html>
